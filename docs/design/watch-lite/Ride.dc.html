<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hour Power Lite: riding the interval</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff6a1a}a:hover{color:#ff8a4a}
</style>
</helmet>
<div style="width: 520px; height: 520px; position: relative; background: #e9edf1; font-family: Inter, system-ui, sans-serif; color: #f3f5f7; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 438px; top: 131px; width: 14px; height: 44px; border-radius: 5px; background: #ff6a1a; transform: rotate(-30deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 438px; top: 345px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f; transform: rotate(30deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 68px; top: 131px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f; transform: rotate(30deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 39px; top: 238px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f"></div>
  <div aria-hidden="true" style="position: absolute; left: 68px; top: 345px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f; transform: rotate(-30deg)"></div>
  <div style="position: absolute; left: 52px; top: 52px; width: 416px; height: 416px; border-radius: 50%; background: #1f262e; box-shadow: 0 20px 44px rgba(18,22,28,0.30), inset 0 0 0 2px #2f3842"></div>
  <div style="position: absolute; left: 68px; top: 68px; width: 384px; height: 384px; border-radius: 50%; background: #000000; overflow: hidden">
    <svg width="384" height="384" viewBox="0 0 384 384" role="img" aria-label="Block progress: 4 min 12 s of 12 min" style="position: absolute; left: 0; top: 0">
      <circle cx="192" cy="192" r="184" fill="none" stroke="#1d2731" stroke-width="10"></circle>
      <circle cx="192" cy="192" r="184" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="405 1157" transform="rotate(-90 192 192)"></circle>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; color: #9aa6b2; letter-spacing: 0.16em">BLOCK 2 / 3</span>
        <span style="font-size: 11px; font-weight: 700; color: #000000; background: #5cc28a; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.08em">ERG</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 2px">
        <span style="font-family: Archivo, system-ui, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 100px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">182</span>
        <span style="font-family: Archivo, system-ui, sans-serif; font-stretch: 125%; font-weight: 700; font-size: 24px; color: #9aa6b2">W</span>
      </div>
      <div role="img" aria-label="182 W, inside the 177 to 185 W target" style="position: relative; margin-top: 10px; width: 200px; height: 10px; border-radius: 5px; background: #1d2731">
        <div style="position: absolute; left: 70px; top: 0; width: 60px; height: 10px; border-radius: 5px; background: #5cc28a"></div>
        <div style="position: absolute; left: 107px; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: #f3f5f7"></div>
      </div>
      <div style="margin-top: 7px; font-size: 13px; font-weight: 600; color: #5cc28a">In zone · 177–185 W</div>
      <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 250px">
        <div style="display: flex; flex-direction: column; align-items: center">
          <span style="font-family: Archivo, system-ui, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums">7:48</span>
          <span style="font-size: 11px; font-weight: 600; color: #9aa6b2; letter-spacing: 0.1em">LEFT</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; border-left: 1px solid #2a323d; border-right: 1px solid #2a323d">
          <span style="font-family: Archivo, system-ui, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums">148</span>
          <span style="font-size: 11px; font-weight: 600; color: #9aa6b2; letter-spacing: 0.1em">BPM</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center">
          <span style="font-family: Archivo, system-ui, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums">91</span>
          <span style="font-size: 11px; font-weight: 600; color: #9aa6b2; letter-spacing: 0.1em">RPM</span>
        </div>
      </div>
      <div style="margin-top: 14px; font-size: 13px; color: #9aa6b2">Next: 4 min easy · 120 W</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff6a1a","options":["#ff6a1a","#38bdf8","#5cc28a"]},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff6a1a' };
  }
}
</script>
</body>
</html>
