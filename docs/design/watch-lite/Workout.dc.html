<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hour Power Lite: today's session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff6a1a}a:hover{color:#ff8a4a}
</style>
</helmet>
<div style="width: 520px; height: 520px; position: relative; background: #e9edf1; font-family: Inter, system-ui, sans-serif; color: #f3f5f7; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 438px; top: 131px; width: 14px; height: 44px; border-radius: 5px; background: #ff6a1a; transform: rotate(-30deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 438px; top: 345px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f; transform: rotate(30deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 68px; top: 131px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f; transform: rotate(30deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 39px; top: 238px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f"></div>
  <div aria-hidden="true" style="position: absolute; left: 68px; top: 345px; width: 14px; height: 44px; border-radius: 5px; background: #3a444f; transform: rotate(-30deg)"></div>
  <div style="position: absolute; left: 52px; top: 52px; width: 416px; height: 416px; border-radius: 50%; background: #1f262e; box-shadow: 0 20px 44px rgba(18,22,28,0.30), inset 0 0 0 2px #2f3842"></div>
  <div style="position: absolute; left: 68px; top: 68px; width: 384px; height: 384px; border-radius: 50%; background: #000000; overflow: hidden">
    <svg width="384" height="384" viewBox="0 0 384 384" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <circle cx="192" cy="192" r="185" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="40 1163" transform="rotate(-36 192 192)"></circle>
    </svg>
    <div style="position: absolute; left: 286px; top: 92px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: {{accent}}; transform: rotate(58deg)">START</div>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
      <div style="font-size: 12px; font-weight: 700; color: #9aa6b2; letter-spacing: 0.16em">TODAY · KEY SESSION</div>
      <div style="margin-top: 6px; font-family: Archivo, system-ui, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.02em">Sweet spot</div>
      <div style="margin-top: 4px; font-size: 17px; font-weight: 600; color: #c9d1d9">3 × 12 min</div>
      <div role="img" aria-label="Workout shape: 10 min warm-up, three 12 min sweet-spot blocks with 4 min easy between, 6 min cool-down" style="margin-top: 14px; width: 250px; height: 56px; display: flex; align-items: flex-end; gap: 2px">
        <div style="flex: 3.3 1 0; height: 30%; background: #3a444f; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 3.3 1 0; height: 40%; background: #3a444f; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 3.3 1 0; height: 52%; background: #3a444f; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 12 1 0; height: 90%; background: {{accent}}; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 4 1 0; height: 38%; background: #3a444f; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 12 1 0; height: 90%; background: {{accent}}; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 4 1 0; height: 38%; background: #3a444f; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 12 1 0; height: 90%; background: {{accent}}; border-radius: 2px 2px 0 0"></div>
        <div style="flex: 6 1 0; height: 32%; background: #3a444f; border-radius: 2px 2px 0 0"></div>
      </div>
      <div style="margin-top: 12px; display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #9aa6b2; letter-spacing: 0.14em">TARGET</span>
        <span style="font-family: Archivo, system-ui, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 22px; color: {{accent}}; font-variant-numeric: tabular-nums">177–185 W</span>
      </div>
      <div style="margin-top: 2px; font-size: 14px; color: #9aa6b2">60 min · ERG on the trainer</div>
      <button type="button" style="margin-top: 14px; display: flex; align-items: center; gap: 8px; padding: 9px 16px; min-height: 44px; border: 1px solid #2a323d; border-radius: 999px; background: #12161c; color: #f3f5f7; font: 600 14px Inter, system-ui, sans-serif">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#9aa6b2" stroke-width="1.5"></circle><path d="M7 4 V7 L9 8.5" fill="none" stroke="#9aa6b2" stroke-width="1.5" stroke-linecap="round"></path></svg>
        Only 35 min?
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff6a1a","options":["#ff6a1a","#38bdf8","#5cc28a"]},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff6a1a' };
  }
}
</script>
</body>
</html>
