# Hour Power on a server (e.g. a DigitalOcean Droplet) with automatic HTTPS.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${DOMAIN}
      TRAINERME_DATA_DIR: /data
    volumes:
      - hour-power-data:/data # your data: goals, rides, settings (survives rebuilds)
    # Also reachable on the server itself (not the internet) for an existing web server to forward to.
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"

  # Caddy gets and renews the HTTPS certificate for DOMAIN and forwards to the app.
  # On a server that already serves other sites on 80/443, deploy with --shared: Caddy is skipped
  # and your existing web server forwards DOMAIN to 127.0.0.1:APP_PORT instead.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  hour-power-data:
  caddy-data:
