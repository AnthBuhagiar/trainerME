# Hour Power on a server (e.g. a DigitalOcean Droplet) with automatic HTTPS.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${DOMAIN}
      TRAINERME_DATA_DIR: /data
    volumes:
      - hour-power-data:/data # your data: goals, rides, settings (survives rebuilds)
    expose:
      - "3000"

  # Caddy gets and renews the HTTPS certificate for DOMAIN and forwards to the app.
  # Skip it (and point your existing web server at port 3000) if the server already serves other sites on 80/443.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  hour-power-data:
  caddy-data:
